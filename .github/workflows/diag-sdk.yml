name: Diagnose Sdk folder

on: workflow_dispatch

jobs:
  diag:
    runs-on: macos-26
    steps:
      - name: Inspect Sdk folder
        shell: bash
        run: |
          dotnet workload install maui 2>&1 | tail -1
          echo "=== Sdk folder contents ==="
          ls -la /Users/runner/.dotnet/packs/Microsoft.Maui.Sdk/10.0.110/Sdk/ 2>/dev/null | head -20 || echo "(not found)"
          echo ""
          echo "=== Sdk.props? ==="
          find /Users/runner/.dotnet/packs/Microsoft.Maui.Sdk/10.0.110 -name "Sdk.props" 2>/dev/null | head -5 || echo "(none)"
          echo ""
          echo "=== Any .props in pack ==="
          find /Users/runner/.dotnet/packs/Microsoft.Maui.Sdk/10.0.110 -name "*.props" 2>/dev/null | head -10
