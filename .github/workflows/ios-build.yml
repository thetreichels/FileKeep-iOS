name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_ROOT: /Users/runner/.dotnet

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Confirm toolchain
        shell: bash
        run: |
          echo "dotnet: $(which dotnet)"
          dotnet --info
          xcode-select -p

      - name: Install MAUI workload
        shell: bash
        run: dotnet workload install maui

      - name: Verify MAUI workload
        shell: bash
        run: dotnet workload list

      - name: Diagnose MAUI SDK location
        shell: bash
        run: |
          echo "=== SDK manifests ==="
          ls /Users/runner/.dotnet/sdk-manifests/10.0.403/ 2>/dev/null || echo "no 10.0.403 manifests"
          echo "=== MAUI manifest ==="
          ls /Users/runner/.dotnet/sdk-manifests/10.0.403/microsoft.net.sdk.maui/ 2>/dev/null || echo "no maui manifest"
          echo "=== Packs ==="
          ls /Users/runner/.dotnet/packs/ | grep -i maui || echo "no maui packs"
          echo "=== Sdks in packs ==="
          find /Users/runner/.dotnet/packs/Microsoft.Maui.Sdk -name "Sdk.props" 2>/dev/null | head -3 || echo "no Sdk.props found"

      - name: Restore dependencies
        run: dotnet restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj

      - name: Build iOS simulator app
        run: >
          dotnet build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          --no-restore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn