name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install .NET 10 SDK fresh
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'

      - name: "Install: MAUI workload"
        shell: bash
        run: |
          dotnet workload install maui
          dotnet workload list
          echo "=== Manifests (feature band) ==="
          find "$DOTNET_ROOT/sdk-manifests" -maxdepth 2 -iname "*maui*" 2>/dev/null | head -5

      - name: Restore dependencies
        run: dotnet restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj

      - name: Build iOS simulator app
        run: >
          dotnet build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          --no-restore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
