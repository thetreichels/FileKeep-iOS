name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Phase 1: Discover ──────────────────────────────────────
      - name: "Discover: dotnet installations"
        id: discover-dotnet
        shell: bash
        run: |
          echo "=== dotnet on PATH ==="
          which -a dotnet || echo "no dotnet on PATH"
          echo ""
          echo "=== known locations ==="
          for d in /Users/runner/.dotnet /usr/local/share/dotnet /usr/share/dotnet "$HOME/.dotnet"; do
            if [ -x "$d/dotnet" ]; then
              echo "FOUND: $d/dotnet"
              "$d/dotnet" --list-sdks 2>/dev/null | sed 's/^/  SDK: /'
            else
              echo "missing: $d"
            fi
          done
          echo ""
          echo "=== Xcode ==="
          ls -d /Applications/Xcode_*.app 2>/dev/null || echo "no Xcode found"
          xcode-select -p 2>/dev/null || echo "xcode-select not set"

      - name: "Discover: select toolchain"
        id: toolchain
        shell: bash
        run: |
          # Prefer a dotnet with a .NET 10 SDK; fall back to newest available
          CHOSEN=""
          for d in /Users/runner/.dotnet /usr/local/share/dotnet /usr/share/dotnet "$HOME/.dotnet"; do
            if [ -x "$d/dotnet" ] && "$d/dotnet" --list-sdks 2>/dev/null | grep -q "^10\."; then
              CHOSEN="$d"
              break
            fi
          done
          if [ -z "$CHOSEN" ]; then
            echo "::error::No .NET 10 SDK found in any known location"
            exit 1
          fi
          echo "chosen=$CHOSEN" >> "$GITHUB_OUTPUT"
          echo "DOTNET_ROOT=$CHOSEN" >> "$GITHUB_ENV"
          echo "Chosen dotnet: $CHOSEN"
          "$CHOSEN/dotnet" --info | head -20

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # ── Phase 2: Ensure MAUI workload ──────────────────────────
      - name: "Ensure: MAUI workload installed"
        shell: bash
        run: |
          D="${{ steps.toolchain.outputs.chosen }}"
          echo "Using dotnet: $D/dotnet"
          if "$D/dotnet" workload list 2>/dev/null | grep -q "^maui"; then
            echo "MAUI workload already installed"
          else
            echo "Installing MAUI workload..."
            "$D/dotnet" workload install maui
          fi
          "$D/dotnet" workload list

      - name: "Verify: SDK resolver sees MAUI"
        shell: bash
        run: |
          D="${{ steps.toolchain.outputs.chosen }}"
          echo "=== workload manifests for installed SDKs ==="
          for sdk in $("$D/dotnet" --list-sdks | awk '{print $1}'); do
            echo "--- $sdk ---"
            ls "$D/sdk-manifests/$sdk/" 2>/dev/null | grep -i maui || echo "(no maui manifest)"
          done
          echo ""
          echo "=== resolver smoke test ==="
          mkdir -p /tmp/sdk-probe
          cat > /tmp/sdk-probe/probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.Maui">
            <PropertyGroup>
              <TargetFramework>net10.0-ios</TargetFramework>
            </PropertyGroup>
          </Project>
          EOF
          cd /tmp/sdk-probe
          if "$D/dotnet" msbuild probe.csproj -t