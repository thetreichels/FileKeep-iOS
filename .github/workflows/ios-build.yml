name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Discover: select toolchain"
        id: toolchain
        shell: bash
        run: |
          CHOSEN=""
          for d in /Users/runner/.dotnet /usr/local/share/dotnet /usr/share/dotnet "$HOME/.dotnet"; do
            if [ -x "$d/dotnet" ] && "$d/dotnet" --list-sdks 2>/dev/null | grep -q "^10\."; then
              CHOSEN="$d"
              break
            fi
          done
          if [ -z "$CHOSEN" ]; then
            echo "::error::No .NET 10 SDK found"
            exit 1
          fi
          echo "chosen=$CHOSEN" >> "$GITHUB_OUTPUT"
          echo "DOTNET_ROOT=$CHOSEN" >> "$GITHUB_ENV"
          echo "Chosen dotnet: $CHOSEN"

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: "Repair: force workload manifest refresh"
        shell: bash
        run: |
          D="${{ steps.toolchain.outputs.chosen }}"
          echo "=== Uninstalling maui (clears stale state) ==="
          "$D/dotnet" workload uninstall maui || true
          echo "=== Updating manifests ==="
          "$D/dotnet" workload update
          echo "=== Reinstalling maui with manifests ==="
          "$D/dotnet" workload install maui
          echo "=== Verify manifest landed ==="
          for sdk in $("$D/dotnet" --list-sdks | awk '{print $1}' | grep "^10\."); do
            echo "--- $sdk ---"
            ls "$D/sdk-manifests/$sdk/" 2>/dev/null | grep -i maui || echo "(no maui manifest)"
          done

      - name: "Verify: SDK resolver sees MAUI"
        shell: bash
        run: |
          D="${{ steps.toolchain.outputs.chosen }}"
          mkdir -p /tmp/sdk-probe
          printf '%s\n' '<Project Sdk="Microsoft.NET.Sdk.Maui">' '  <PropertyGroup>' '    <TargetFramework>net10.0-ios</TargetFramework>' '  </PropertyGroup>' '</Project>' > /tmp/sdk-probe/probe.csproj
          cd /tmp/sdk-probe
          if "$D/dotnet" msbuild probe.csproj "-t:_CheckForInvalidConfigurationAndPlatform" -v:q 2>&1 | grep -qi "error MSB4236"; then
            echo "::error::MSBuild still cannot resolve Microsoft.NET.Sdk.Maui"
            exit 1
          fi
          echo "OK: resolver sees Microsoft.NET.Sdk.Maui"

      - name: Restore dependencies
        shell: bash
        run: |
          "${{ steps.toolchain.outputs.chosen }}/dotnet" restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj

      - name: Build iOS simulator app
        shell: bash
        run: >
          "${{ steps.toolchain.outputs.chosen }}/dotnet" build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          --no-restore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn