name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: "Install: MAUI workload"
        shell: bash
        run: |
          dotnet workload install maui
          dotnet workload list

      - name: "Fix: link feature-band manifests to SDK version"
        shell: bash
        run: |
          D="/Users/runner/.dotnet"
          for sdk in $(dotnet --list-sdks | awk '{print $1}' | grep "^10\."); do
            band=$(echo "$sdk" | cut -d. -f1,2).100
            src="$D/sdk-manifests/$band"
            dst="$D/sdk-manifests/$sdk"
            if [ -d "$src" ] && [ ! -e "$dst" ]; then
              echo "Linking $src -> $dst"
              ln -s "$src" "$dst"
            fi
          done
          echo "=== Manifests now ==="
          ls /Users/runner/.dotnet/sdk-manifests/10.0.403/ 2>/dev/null | head -5

      - name: Restore dependencies
        run: dotnet restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj

      - name: Build iOS simulator app
        run: >
          dotnet build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          --no-restore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
