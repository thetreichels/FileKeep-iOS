name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate submodule
        shell: bash
        run: |
          echo "=== .gitmodules ==="
          cat .gitmodules || echo "(no .gitmodules)"
          echo "=== submodule status before ==="
          git submodule status || true
          echo "=== sync and update ==="
          git submodule sync --recursive || true
          git submodule update --init --recursive --force || echo "UPDATE FAILED"
          echo "=== submodule status after ==="
          git submodule status || true
          echo "=== external dir ==="
          ls -la external/ || echo "(no external dir)"
          ls -la external/FileKeep/ 2>/dev/null || echo "(no external/FileKeep)"
          echo "=== checking for csproj ==="
          test -f external/FileKeep/src/FileKeep.Core/FileKeep.Core.csproj && echo "FOUND" || echo "MISSING"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Select Xcode and validate SDKs
        shell: bash
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
          dotnet --list-sdks

      - name: Install MAUI workload
        shell: bash
        run: |
          dotnet workload update --ignore-failed-sources
          dotnet workload install maui --ignore-failed-sources

      - name: Restore and build
        shell: bash
        run: |
          dotnet workload restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          dotnet restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          dotnet build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:EnableCodeSigning=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:BuildIpa=false

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
