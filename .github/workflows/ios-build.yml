name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Discover: select toolchain"
        id: toolchain
        shell: bash
        run: |
          CHOSEN=""
          for d in /Users/runner/.dotnet /usr/local/share/dotnet /usr/share/dotnet "$HOME/.dotnet"; do
            if [ -x "$d/dotnet" ] && "$d/dotnet" --list-sdks 2>/dev/null | grep -q "^10\."; then
              CHOSEN="$d"
              break
            fi
          done
          if [ -z "$CHOSEN" ]; then
            echo "::error::No .NET 10 SDK found"
            exit 1
          fi
          echo "chosen=$CHOSEN" >> "$GITHUB_OUTPUT"
          echo "DOTNET_ROOT=$CHOSEN" >> "$GITHUB_ENV"
          echo "Chosen dotnet: $CHOSEN"

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: "Clean: remove all MAUI workload state"
        shell: bash
        run: |
          D="${{ steps.toolchain.outputs.chosen }}"
          echo "=== Removing workload manifests ==="
          rm -rf "$D/sdk-manifests" || true
          echo "=== Removing workload metadata ==="
          rm -rf "$D/metadata/workloads" || true
          echo "=== Removing MAUI packs ==="
          rm -rf "$D/packs/Microsoft.Maui."* || true
          rm -rf "$D/packs/Microsoft.iOS."* || true
          rm -rf "$D/packs/Microsoft.MacCatalyst."* || true
          rm -rf "$D/packs/Microsoft.Android."* || true
          echo "=== State after clean ==="
          ls "$D/sdk-manifests/" 2>/dev/null || echo "(no manifests dir)"
          "$D/dotnet" workload list 2>&1 || true

      - name: "Install: MAUI workload fresh"
        shell: bash
        run: |
          D="${{ steps.toolchain.outputs.chosen }}"
          "$D/dotnet" workload install maui
          echo "=== Workload list ==="
          "$D/dotnet" workload list

      - name: "Verify: manifest exists on disk"
        shell: bash
        run: |
          D="${{ steps.toolchain.outputs.chosen }}"
          FOUND=0
          for sdk in $("$D/dotnet" --list-sdks | awk '{print $1}' | grep "^10\."); do
            if [ -d "$D/sdk-manifests/$sdk/microsoft.net.sdk.maui" ]; then
              echo "FOUND: $D/sdk-manifests/$sdk/microsoft.net.sdk.maui"
              ls "$D/sdk-manifests/$sdk/microsoft.net.sdk.maui/"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::MAUI workload manifest NOT found on disk after fresh install. SDK resolver will fail."
            echo "=== All manifests ==="
            find "$D/sdk-manifests" -maxdepth 2 -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "Manifest verified on disk."

      - name: Restore dependencies
        shell: bash
        run: |
          "${{ steps.toolchain.outputs.chosen }}/dotnet" restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj

      - name: Build iOS simulator app
        shell: bash
        run: >
          "${{ steps.toolchain.outputs.chosen }}/dotnet" build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          --no-restore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
