name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install .NET 10 SDK fresh
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'

      - name: "Discover: selected dotnet"
        id: toolchain
        shell: bash
        run: |
          echo "dotnet: $(which dotnet)"
          dotnet --list-sdks | head -5
          echo "DOTNET_ROOT=${DOTNET_ROOT:-<unset>}"
          # setup-dotnet sets DOTNET_ROOT and updates PATH; capture the dir
          CHOSEN="$(dirname "$(which dotnet)")"
          # which gives .../dotnet, we want the root containing dotnet/
          if [ -x "$CHOSEN/dotnet" ]; then
            ROOT="$CHOSEN"
          else
            ROOT="$(cd "$CHOSEN/.." && pwd)"
          fi
          echo "chosen=$ROOT" >> "$GITHUB_OUTPUT"
          echo "DOTNET_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Using dotnet root: $ROOT"

      - name: "Install: MAUI workload"
        shell: bash
        run: |
          dotnet workload install maui
          dotnet workload list

      - name: "Verify: manifest exists on disk"
        shell: bash
        run: |
          D="${{ steps.toolchain.outputs.chosen }}"
          echo "Checking under: $D"
          FOUND=0
          for sdk in $(dotnet --list-sdks | awk '{print $1}' | grep "^10\."); do
            if [ -d "$D/sdk-manifests/$sdk/microsoft.net.sdk.maui" ]; then
              echo "FOUND: $D/sdk-manifests/$sdk/microsoft.net.sdk.maui"
              FOUND=1
            fi
          done
          # Also check the default location in case DOTNET_ROOT differs
          for dir in "$D" "$HOME/.dotnet" /usr/local/share/dotnet; do
            if [ -d "$dir/sdk-manifests" ]; then
              echo "--- manifests in $dir ---"
              find "$dir/sdk-manifests" -maxdepth 2 -iname "*maui*" 2>/dev/null | head -5
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::MAUI manifest still not found after fresh SDK + workload install"
            exit 1
          fi
          echo "Manifest verified."

      - name: Restore dependencies
        run: dotnet restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj

      - name: Build iOS simulator app
        run: >
          dotnet build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          --no-restore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
