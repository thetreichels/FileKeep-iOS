name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'

      - name: "Nuke: empty pack shells"
        shell: bash
        run: |
          D="/Users/runner/.dotnet"
          echo "=== Deleting all Microsoft workload packs ==="
          rm -rf "$D/packs/Microsoft.Maui."*
          rm -rf "$D/packs/Microsoft.iOS."*
          rm -rf "$D/packs/Microsoft.MacCatalyst."*
          rm -rf "$D/packs/Microsoft.Android."*
          rm -rf "$D/packs/Microsoft.NETCore.App.Runtime."*Mono*
          echo "=== Deleting workload metadata ==="
          rm -rf "$D/metadata/workloads"
          echo "=== Deleting manifests ==="
          rm -rf "$D/sdk-manifests/10.0.100/microsoft.net.sdk.maui"
          rm -rf "$D/sdk-manifests/10.0.100/microsoft.net.sdk.ios"
          rm -rf "$D/sdk-manifests/10.0.100/microsoft.net.sdk.maccatalyst"
          rm -rf "$D/sdk-manifests/10.0.100/microsoft.net.sdk.android"
          echo "Nuke complete."

      - name: "Install: MAUI workload (no skip flags, verbose)"
        shell: bash
        run: dotnet workload install maui --verbosity detailed 2>&1 | tail -30

      - name: "Verify: pack has Sdks folder"
        shell: bash
        run: |
          find /Users/runner/.dotnet/packs/Microsoft.Maui.Sdk -maxdepth 3 -name "Sdks" -type d 2>/dev/null || (echo "::error::No Sdks folder in pack - download failed" && exit 1)
          echo "Pack Sdks folder verified."

      - name: Restore dependencies
        run: dotnet restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj

      - name: Build iOS simulator app
        run: >
          dotnet build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          --no-restore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
