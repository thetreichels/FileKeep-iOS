name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate submodule
        shell: bash
        run: |
          echo "=== .gitmodules ==="
          cat .gitmodules || echo "(no .gitmodules)"
          echo "=== submodule status ==="
          git submodule status || true
          echo "=== external dir ==="
          ls -la external/ 2>/dev/null || echo "(no external dir)"
          find external -maxdepth 3 -type d 2>/dev/null || true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.0.app/Contents/Developer
          sudo xcodebuild -license accept || true
          xcodebuild -version

      - name: Reinstall MAUI workload
        shell: bash
        run: |
          dotnet workload uninstall maui || true
          dotnet workload install maui --ignore-failed-sources --skip-manifest-update
          dotnet workload list

      - name: Restore and build
        shell: bash
        run: |
          dotnet restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj
          dotnet build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:EnableCodeSigning=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:BuildIpa=false \
            --no-restore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
