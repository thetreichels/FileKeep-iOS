# Builds the MAUI iOS app on a GitHub-hosted macOS runner.
# No Mac required on the developer side.
#
# What it does: compile verification for net10.0-ios (simulator, unsigned).
# What it does NOT do (yet): sign an .ipa or upload to TestFlight — that
# needs an Apple Developer account and App Store Connect credentials.

name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out (with FileKeep.Core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore
        run: dotnet restore FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj

      - name: Build (iOS simulator, unsigned)
        run: dotnet build FileKeep.Reader.iOS/FileKeep.Reader.iOS.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64 --no-restore

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: FileKeep.Reader-simulator
          path: FileKeep.Reader.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn