name: Diagnose Sdk.props

on: workflow_dispatch

jobs:
  diag:
    runs-on: macos-26
    steps:
      - name: Read Sdk.props
        shell: bash
        run: |
          dotnet workload install maui 2>&1 | tail -1
          echo "=== Sdk.props content ==="
          cat /Users/runner/.dotnet/packs/Microsoft.Maui.Sdk/10.0.110/Sdk/Sdk.props 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Sdk.targets content (head) ==="
          head -20 /Users/runner/.dotnet/packs/Microsoft.Maui.Sdk/10.0.110/Sdk/Sdk.targets 2>/dev/null || echo "(not found)"
